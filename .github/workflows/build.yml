name: Build for Windows ARM64

on:
  push:

jobs:
  build-windows-arm64:
    name: Build
    runs-on: windows-latest
    env:
      qt_path: "${{ github.workspace }}/qt-msvc-arm64"
      qt_version: "5.15.18"
      jom_version: "1.1.7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install build tools
        run: |
          choco install jom ninja

      - name: Setup devcmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt (target arm64)
        run: |
          git clone https://github.com/qt/qt5.git qt5
          cd qt5
          git checkout "v${{ env.qt_version }}-lts-lgpl"
          perl init-repository --module-subset=qtbase
          ./configure -opensource -confirm-license -nomake tests -nomake examples `
            -static -static-runtime -release -platform win32-msvc -xplatform win32-arm64-msvc2017 `
            -prefix "${{ env.qt_path }}"
          jom
          jom install

      - name: Setup devcmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Build Jom
        run: |
          git clone --branch v${{ env.jom_version }} --depth 1 https://github.com/qt-labs/jom.git 
          cd jom
          cmake -B "build" -G "Ninja" -DCMAKE_PREFIX_PATH="${{ env.qt_path }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>"
          cmake --build build

      - name: Prepare build artifacts
        run: |
          mkdir upload
          cd upload
          cp ${{ github.workspace }}/jom/build/bin/jom.exe .
          cp ${{ github.workspace }}/jom/changelog.txt .
          cp ${{ github.workspace }}/jom/bin/* .
          7z a jom_${{ env.jom_version }}_arm64.zip *
          mv jom_${{ env.jom_version }}_arm64.zip ..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: jom_${{ env.jom_version }}_arm64
          path: upload

      - name: Batch release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: jom_${{ env.jom_version }}_arm64.zip